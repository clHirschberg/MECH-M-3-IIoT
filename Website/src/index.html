<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>IIoT Dashboard</title>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="icons/thermometer_icon.svg">
  <script>
    // Farbschema vor dem ersten Rendern setzen (kein helles Aufblitzen im Darkmode)
    try {
      var t = localStorage.getItem('iiot-theme');
      if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
