<main class="min-h-screen bg-slate-100 p-6">
  <div class="mx-auto max-w-lg space-y-6">
    <h1 class="text-2xl font-bold">ESP Dashboard</h1>

    <section class="space-y-4 rounded-xl bg-white p-6 shadow">
      <h2 class="text-lg font-semibold">Status</h2>
      <p>{{ status() }}</p>

      <button
        type="button"
        (click)="getStatus()"
        class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
      >
        Status abfragen
      </button>
    </section>

    <section class="space-y-4 rounded-xl bg-white p-6 shadow">
      <h2 class="text-lg font-semibold">Übertragungsintervall</h2>

      <label for="interval" class="block">Intervall in Millisekunden</label>
      <input
        id="interval"
        type="number"
        min="1"
        step="1"
        [(ngModel)]="interval"
        class="w-full rounded border border-slate-300 p-2"
      />

      <div class="flex gap-3">
        <button
          type="button"
          (click)="getInterval()"
          class="rounded bg-slate-200 px-4 py-2 hover:bg-slate-300"
        >
          Abfragen
        </button>

        <button
          type="button"
          (click)="saveInterval()"
          class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
        >
          Speichern
        </button>
      </div>
    </section>

    <p role="status" class="text-sm text-slate-700">{{ message() }}</p>
  </div>
</main>
